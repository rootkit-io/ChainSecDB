[project]
name = "security-research-db"
version = "0.1.0"
description = "Raw security-document ingestion foundation"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128,<1",
    "uvicorn>=0.40,<1",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.12,<3",
    "sqlalchemy[asyncio]>=2.0.46,<2.1",
    "alembic>=1.18,<2",
    "psycopg[binary]>=3.2,<4",
    "openai>=3.26.1,<4",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "ruff>=0.14,<1",
    "mypy>=1.19,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "alembic"]
